<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Piano">
<meta name="theme-color" content="#F7F0E6">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<title>Piano alimentare</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
  :root {
    --crema: #F7F0E6;
    --carta: #FFFDF9;
    --salmone: #E6C3AF;
    --salmone-chiaro: #F1DDD0;
    --burro: #F3DC8F;
    --burro-chiaro: #F8ECC4;
    --salvia: #CADFBE;
    --inchiostro: #5B3A2E;
    --inchiostro-tenue: #8A6E62;
    --linea: #E8DCCF;
    --verde: #6AA84F;
    --rosso: #CC4125;
    --titoli: "Bricolage Grotesque", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    --testo: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    --fascia: var(--salmone);
    --fascia-chiara: var(--salmone-chiaro);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--crema); color: var(--inchiostro); font-family: var(--testo); font-size: 16px; line-height: 1.4; }
  body { padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 24px); min-height: 100vh; }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--inchiostro); outline-offset: 2px; }
  .nascosto { display: none !important; }

  /* Testata del giorno: la fascia cambia colore come nel foglio */
  .testata {
    position: sticky; top: 0; z-index: 5;
    background: var(--fascia);
    padding: calc(env(safe-area-inset-top, 0px) + 10px) 12px 12px;
    display: grid; grid-template-columns: 44px 1fr 44px 44px; align-items: center; gap: 4px;
    transition: background-color .3s;
  }
  .testata h1 {
    margin: 0; text-align: center; font-family: var(--titoli); font-weight: 700;
    font-size: 21px; letter-spacing: -0.01em; line-height: 1.15;
  }
  .testata h1 small { display: block; font-family: var(--testo); font-weight: 500; font-size: 13px; color: var(--inchiostro-tenue); letter-spacing: 0; }
  .tondo { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-size: 22px; }
  .tondo:active { background: rgba(91,58,46,.08); }
  .tondo[disabled] { opacity: .3; }
  .tondo svg { width: 22px; height: 22px; stroke: var(--inchiostro); stroke-width: 2.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }

  main { max-width: 560px; margin: 0 auto; }

  /* Torta delle categorie */
  .torta { display: grid; place-items: center; padding: 26px 16px 8px; position: relative; }
  .torta svg { width: min(72vw, 280px); height: auto; overflow: visible; }
  .torta .centro { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; text-align: center; }
  .torta .numero { font-family: var(--titoli); font-weight: 800; font-size: clamp(44px, 13vw, 58px); line-height: 1; letter-spacing: -0.03em; }
  .torta .di { font-size: 14px; color: var(--inchiostro-tenue); margin-top: 4px; }
  .torta .resto { font-size: 13px; margin-top: 2px; font-weight: 600; }
  .torta .resto.sopra { color: var(--rosso); }
  .legenda { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 14px; padding: 6px 20px 4px; font-size: 13px; }
  .legenda span { display: inline-flex; align-items: center; gap: 6px; }
  .legenda i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .legenda b { font-weight: 600; }

  /* Macro in grammi */
  .macro { display: grid; grid-template-columns: repeat(3, 1fr); margin: 18px 16px 6px; background: var(--carta); border-radius: 18px; border: 1px solid var(--linea); }
  .macro div { padding: 12px 8px; text-align: center; }
  .macro div + div { border-left: 1px solid var(--linea); }
  .macro strong { display: block; font-family: var(--titoli); font-weight: 700; font-size: 24px; letter-spacing: -0.02em; }
  .macro span { font-size: 13px; color: var(--inchiostro-tenue); }

  /* Pasti */
  .pasti { margin: 18px 16px 0; background: var(--carta); border-radius: 18px; border: 1px solid var(--linea); overflow: hidden; }
  .pasto { width: 100%; text-align: left; padding: 14px 16px; display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; align-items: start; }
  .pasto + .pasto { border-top: 1px solid var(--linea); }
  .pasto:active { background: var(--crema); }
  .pasto h2 { margin: 0; font-family: var(--titoli); font-weight: 700; font-size: 18px; }
  .pasto .kcal { font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .pasto .kcal small { font-weight: 400; color: var(--inchiostro-tenue); }
  .pasto .scelti { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { background: var(--crema); border: 1px solid var(--linea); border-radius: 999px; padding: 4px 11px; font-size: 14px; line-height: 1.3; }
  .vuoto { color: var(--inchiostro-tenue); font-size: 14px; }

  /* Allenamento */
  .allenamento { margin: 18px 16px 0; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .interruttore { padding: 14px; border-radius: 16px; border: 1px solid var(--linea); background: var(--carta); display: flex; align-items: center; justify-content: space-between; font-weight: 600; }
  .interruttore .levetta { width: 44px; height: 26px; border-radius: 13px; background: var(--linea); position: relative; transition: background .2s; flex: none; }
  .interruttore .levetta::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.2); transition: transform .2s; }
  .interruttore[aria-pressed="true"] .levetta { background: var(--verde); }
  .interruttore[aria-pressed="true"] .levetta::after { transform: translateX(18px); }
  .etichetta-sezione { margin: 22px 20px 0; font-size: 14px; color: var(--inchiostro-tenue); font-weight: 600; }

  /* Giorno non presente / caricamento */
  .messaggio { margin: 40px 24px; text-align: center; }
  .messaggio p { color: var(--inchiostro-tenue); }
  .bottone { display: inline-block; background: var(--inchiostro); color: var(--crema); padding: 13px 22px; border-radius: 14px; font-weight: 600; }
  .bottone:active { opacity: .85; }
  .bottone.secondario { background: transparent; color: var(--inchiostro); border: 1px solid var(--inchiostro); }

  /* Pannello di scelta alimenti */
  .velo { position: fixed; inset: 0; background: rgba(60,38,30,.35); z-index: 20; opacity: 0; transition: opacity .2s; }
  .velo.aperto { opacity: 1; }
  .pannello {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; background: var(--crema);
    border-radius: 22px 22px 0 0; height: 92vh; display: flex; flex-direction: column;
    transform: translateY(100%); visibility: hidden; transition: transform .28s cubic-bezier(.2,.8,.2,1), visibility 0s linear .28s;
  }
  .pannello.aperto { transform: translateY(0); visibility: visible; transition: transform .28s cubic-bezier(.2,.8,.2,1); }
  .pannello header { padding: 10px 16px 8px; }
  .pannello .maniglia { width: 40px; height: 5px; border-radius: 3px; background: var(--linea); margin: 0 auto 10px; }
  .pannello .riga-titolo { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .pannello h3 { margin: 0; font-family: var(--titoli); font-weight: 700; font-size: 22px; }
  .cerca { margin-top: 10px; width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--linea); background: var(--carta); font: inherit; font-size: 16px; color: var(--inchiostro); }
  .filtri { display: flex; gap: 6px; overflow-x: auto; padding: 10px 16px 6px; scrollbar-width: none; }
  .filtri::-webkit-scrollbar { display: none; }
  .filtro { flex: none; padding: 7px 12px; border-radius: 999px; border: 1px solid var(--linea); background: var(--carta); font-size: 14px; display: inline-flex; align-items: center; gap: 6px; }
  .filtro i { width: 9px; height: 9px; border-radius: 50%; }
  .filtro[aria-pressed="true"] { background: var(--inchiostro); color: var(--crema); border-color: var(--inchiostro); }
  .selezionati { padding: 4px 16px 8px; display: flex; flex-wrap: wrap; gap: 6px; min-height: 8px; }
  .selezionati .chip { background: var(--burro-chiaro); border-color: var(--burro); display: inline-flex; align-items: center; gap: 6px; }
  .selezionati .chip button { font-size: 16px; line-height: 1; padding: 0 2px; }
  .lista { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 0 16px 16px; }
  .gruppo { margin-top: 12px; font-size: 13px; font-weight: 700; color: var(--inchiostro-tenue); display: flex; align-items: center; gap: 8px; }
  .gruppo i { width: 9px; height: 9px; border-radius: 50%; }
  .voce { width: 100%; display: flex; align-items: center; gap: 12px; padding: 11px 4px; border-bottom: 1px solid var(--linea); text-align: left; }
  .voce .spunta { width: 24px; height: 24px; border-radius: 7px; border: 2px solid var(--salmone); flex: none; display: grid; place-items: center; }
  .voce[aria-checked="true"] .spunta { background: var(--inchiostro); border-color: var(--inchiostro); }
  .voce[aria-checked="true"] .spunta::after { content: ""; width: 6px; height: 11px; border: solid var(--crema); border-width: 0 2.5px 2.5px 0; transform: rotate(45deg) translate(-1px, -1px); }
  .voce .nome { flex: 1; }
  .voce .porzione { font-size: 13px; color: var(--inchiostro-tenue); white-space: nowrap; }
  .pannello footer { padding: 10px 16px calc(env(safe-area-inset-bottom, 0px) + 12px); border-top: 1px solid var(--linea); background: var(--crema); }
  .pannello footer .bottone { width: 100%; text-align: center; font-size: 17px; }

  /* Impostazioni */
  .impostazioni { max-width: 460px; margin: 0 auto; padding: calc(env(safe-area-inset-top, 0px) + 40px) 22px 30px; }
  .impostazioni h1 { font-family: var(--titoli); font-weight: 800; font-size: 34px; letter-spacing: -0.02em; margin: 0 0 6px; }
  .impostazioni p { color: var(--inchiostro-tenue); margin: 0 0 22px; }
  .impostazioni label { display: block; font-weight: 600; margin: 16px 0 6px; font-size: 15px; }
  .impostazioni input { width: 100%; padding: 13px 14px; border-radius: 12px; border: 1px solid var(--linea); background: var(--carta); font: inherit; font-size: 16px; color: var(--inchiostro); }
  .impostazioni .bottone { margin-top: 24px; width: 100%; text-align: center; }

  /* Avvisi */
  .avviso { position: fixed; left: 16px; right: 16px; bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); z-index: 40; background: var(--inchiostro); color: var(--crema); padding: 13px 16px; border-radius: 14px; font-size: 15px; transform: translateY(calc(100% + 60px)); visibility: hidden; transition: transform .25s, visibility 0s linear .25s; }
  .avviso.visibile { transform: translateY(0); visibility: visible; transition: transform .25s; }
  .attesa { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 66px); left: 50%; transform: translateX(-50%); z-index: 30; background: var(--carta); border: 1px solid var(--linea); padding: 6px 14px; border-radius: 999px; font-size: 13px; color: var(--inchiostro-tenue); }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<!-- Prima configurazione -->
<section id="impostazioni" class="impostazioni nascosto">
  <h1>Piano alimentare</h1>
  <p>Collega l'app al tuo foglio Google. Lo fai una volta sola su questo telefono.</p>
  <label for="url">Indirizzo dell'app web dello script</label>
  <input id="url" type="url" inputmode="url" autocomplete="off" autocapitalize="off" placeholder="https://script.google.com/macros/s/…/exec">
  <label for="token">Parola segreta</label>
  <input id="token" type="password" autocomplete="off" autocapitalize="off" placeholder="La stessa scritta nello script">
  <button class="bottone" id="collega">Collega il foglio</button>
</section>

<!-- App -->
<div id="app" class="nascosto">
  <div class="testata" id="testata">
    <button class="tondo" id="prec" aria-label="Giorno precedente"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <h1 id="titolo">…</h1>
    <button class="tondo" id="succ" aria-label="Giorno successivo"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
    <button class="tondo" id="nuovo" aria-label="Aggiungi il giorno successivo"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
  </div>
  <main id="contenuto"></main>
</div>

<div class="velo nascosto" id="velo"></div>
<section class="pannello" id="pannello" role="dialog" aria-modal="true" aria-labelledby="pannello-titolo">
  <header>
    <div class="maniglia"></div>
    <div class="riga-titolo">
      <h3 id="pannello-titolo">Colazione</h3>
      <button class="tondo" id="chiudi" aria-label="Chiudi senza salvare"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <input class="cerca" id="cerca" type="search" placeholder="Cerca un alimento" autocomplete="off">
  </header>
  <div class="filtri" id="filtri"></div>
  <div class="selezionati" id="selezionati"></div>
  <div class="lista" id="lista"></div>
  <footer><button class="bottone" id="salva">Salva</button></footer>
</section>

<div class="attesa nascosto" id="attesa">Aggiornamento…</div>
<div class="avviso" id="avviso" role="status"></div>

<script>
(function () {
  const COLORI = {
    'Carboidrati': '#E8B04F', 'Proteine': '#B5523B', 'Verdure': '#6AA84F', 'Frutta': '#E07B8C',
    'Latticini': '#9FC5E8', 'Grassi': '#8E6E53', 'Extra': '#B4A7D6'
  };
  const GIORNI = ['domenica', 'lunedì', 'martedì', 'mercoledì', 'giovedì', 'venerdì', 'sabato'];
  const MESI = ['gennaio', 'febbraio', 'marzo', 'aprile', 'maggio', 'giugno', 'luglio', 'agosto', 'settembre', 'ottobre', 'novembre', 'dicembre'];

  const stato = {
    url: localStorage.getItem('pa_url') || '',
    token: localStorage.getItem('pa_token') || '',
    dati: null,
    giorni: [],
    corrente: null,
    giorno: null,
    pasto: null,
    scelta: [],
    filtro: null
  };

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmt = (n, d) => Number(n || 0).toLocaleString('it-IT', { maximumFractionDigits: d || 0, minimumFractionDigits: 0 });

  /* ---------- Comunicazione con il foglio ---------- */
  async function chiedi(parametri) {
    const q = new URLSearchParams(Object.assign({ token: stato.token }, parametri));
    const r = await fetch(stato.url + '?' + q.toString());
    return controlla(await r.json());
  }
  async function invia(corpo) {
    const r = await fetch(stato.url, { method: 'POST', body: JSON.stringify(Object.assign({ token: stato.token }, corpo)) });
    return controlla(await r.json());
  }
  function controlla(j) {
    if (!j.ok) throw new Error(j.errore || 'Il foglio non ha risposto correttamente.');
    return j;
  }
  function attesa(si) { $('attesa').classList.toggle('nascosto', !si); }
  let timerAvviso;
  function avviso(testo) {
    const a = $('avviso');
    a.textContent = testo;
    a.classList.add('visibile');
    clearTimeout(timerAvviso);
    timerAvviso = setTimeout(() => a.classList.remove('visibile'), 3200);
  }

  /* ---------- Date ---------- */
  function dataDa(iso) { const p = iso.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }
  function seriale(iso) { const p = iso.split('-').map(Number); return Math.round((Date.UTC(p[0], p[1] - 1, p[2]) - Date.UTC(1899, 11, 30)) / 86400000); }
  function etichetta(iso) {
    const d = dataDa(iso);
    return { giorno: GIORNI[d.getDay()] + ' ' + d.getDate(), mese: MESI[d.getMonth()] + ' ' + d.getFullYear() };
  }
  function coloreFascia(iso) {
    const d = dataDa(iso);
    const t = $('testata');
    if (d.getDay() === 0 || d.getDay() === 6) { t.style.setProperty('--fascia', 'var(--salvia)'); }
    else if (seriale(iso) % 2) { t.style.setProperty('--fascia', 'var(--burro)'); }
    else { t.style.setProperty('--fascia', 'var(--salmone)'); }
  }

  /* ---------- Avvio ---------- */
  async function avvia() {
    if (!stato.url || !stato.token) { mostraImpostazioni(); return; }
    $('impostazioni').classList.add('nascosto');
    $('app').classList.remove('nascosto');
    const cache = localStorage.getItem('pa_dati');
    if (cache) { try { stato.dati = JSON.parse(cache); } catch (e) { /* cache non valida */ } }
    attesa(true);
    try {
      const j = await chiedi({ action: 'init' });
      stato.dati = j.dati;
      stato.giorni = j.giorni;
      localStorage.setItem('pa_dati', JSON.stringify(j.dati));
      await vaiA(stato.giorni[0] || null);
    } catch (e) {
      $('contenuto').innerHTML = '<div class="messaggio"><p>' + esc(e.message) + '</p><button class="bottone secondario" id="riprova">Riprova</button> <button class="bottone secondario" id="cambia">Cambia collegamento</button></div>';
      $('riprova').onclick = avvia;
      $('cambia').onclick = mostraImpostazioni;
    } finally { attesa(false); }
  }

  function mostraImpostazioni() {
    $('app').classList.add('nascosto');
    $('impostazioni').classList.remove('nascosto');
    $('url').value = stato.url;
    $('token').value = stato.token;
  }

  $('collega').onclick = async () => {
    const url = $('url').value.trim();
    const token = $('token').value.trim();
    if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(url)) { avviso('L\'indirizzo deve iniziare con https://script.google.com e finire con /exec.'); return; }
    if (!token) { avviso('Scrivi la parola segreta che hai messo nello script.'); return; }
    stato.url = url; stato.token = token;
    localStorage.setItem('pa_url', url);
    localStorage.setItem('pa_token', token);
    avvia();
  };

  /* ---------- Giorno ---------- */
  async function vaiA(iso) {
    stato.corrente = iso;
    aggiornaTestata();
    if (!iso) { mostraVuoto(); return; }
    attesa(true);
    try {
      const j = await chiedi({ action: 'giorno', data: iso });
      stato.giorno = j.giorno;
      disegna();
    } catch (e) { avviso(e.message); }
    finally { attesa(false); }
  }

  function aggiornaTestata() {
    const iso = stato.corrente;
    const i = stato.giorni.indexOf(iso);
    $('prec').disabled = i < 0 || i >= stato.giorni.length - 1;
    $('succ').disabled = i <= 0;
    if (iso) {
      const e = etichetta(iso);
      $('titolo').innerHTML = esc(e.giorno) + '<small>' + esc(e.mese) + '</small>';
      coloreFascia(iso);
    } else {
      $('titolo').innerHTML = 'Nessun giorno<small>aggiungine uno</small>';
    }
  }

  function mostraVuoto() {
    $('contenuto').innerHTML = '<div class="messaggio"><p>Nel foglio non ci sono ancora giorni.</p><button class="bottone" id="primo">Aggiungi il primo giorno</button></div>';
    $('primo').onclick = nuovoGiorno;
  }

  function disegna() {
    const g = stato.giorno;
    const ob = stato.dati.obiettivi;
    if (!g || !g.esiste) {
      $('contenuto').innerHTML = '<div class="messaggio"><p>Questo giorno non è più nel foglio.</p><button class="bottone secondario" id="ricarica">Aggiorna</button></div>';
      $('ricarica').onclick = avvia;
      return;
    }
    const kcal = g.totale.kcal;
    const resto = ob.kcal - kcal;
    let html = '';

    // Torta delle categorie
    html += '<section class="torta" aria-label="Calorie per categoria">' + torta(g.categorie) +
      '<div class="centro"><div><div class="numero">' + fmt(kcal) + '</div><div class="di">di ' + fmt(ob.kcal) + ' kcal</div>' +
      '<div class="resto' + (resto < 0 ? ' sopra' : '') + '">' + (resto < 0 ? fmt(-resto) + ' oltre l\'obiettivo' : fmt(resto) + ' rimanenti') + '</div></div></div></section>';
    const conValori = g.categorie.filter((c) => c.kcal > 0);
    html += '<div class="legenda">' + (conValori.length
      ? conValori.map((c) => '<span><i style="background:' + (COLORI[c.nome] || '#ccc') + '"></i>' + esc(c.nome) + ' <b>' + fmt(c.kcal) + '</b></span>').join('')
      : '<span class="vuoto">Scegli cosa hai mangiato per vedere la torta</span>') + '</div>';

    // Macro in grammi
    html += '<div class="macro">' +
      '<div><strong>' + fmt(g.totale.proteine) + ' g</strong><span>Proteine</span></div>' +
      '<div><strong>' + fmt(g.totale.carboidrati) + ' g</strong><span>Carboidrati</span></div>' +
      '<div><strong>' + fmt(g.totale.grassi) + ' g</strong><span>Grassi</span></div></div>';

    // Pasti
    html += '<div class="pasti">' + g.pasti.map((p, i) =>
      '<button class="pasto" data-pasto="' + i + '"><h2>' + esc(p.nome) + '</h2>' +
      '<span class="kcal">' + (p.alimenti.length ? fmt(p.kcal) + ' <small>kcal</small>' : '') + '</span>' +
      '<div class="scelti">' + (p.alimenti.length
        ? p.alimenti.map((a) => '<span class="chip">' + esc(a) + '</span>').join('')
        : '<span class="vuoto">Tocca per scegliere gli alimenti</span>') + '</div></button>').join('') + '</div>';

    // Allenamento
    html += '<div class="etichetta-sezione">Allenamento</div><div class="allenamento">' +
      '<button class="interruttore" data-tipo="muscolare" aria-pressed="' + g.allenamento.muscolare + '">Muscolare <span class="levetta"></span></button>' +
      '<button class="interruttore" data-tipo="cardio" aria-pressed="' + g.allenamento.cardio + '">Cardio <span class="levetta"></span></button></div>';

    $('contenuto').innerHTML = html;
    document.querySelectorAll('.pasto').forEach((b) => b.onclick = () => apriPannello(Number(b.dataset.pasto)));
    document.querySelectorAll('.interruttore').forEach((b) => b.onclick = () => cambiaAllenamento(b));
  }

  function torta(categorie) {
    const r = 46, c = 2 * Math.PI * r;
    const valori = categorie.filter((x) => x.kcal > 0);
    const totale = valori.reduce((s, x) => s + x.kcal, 0);
    let svg = '<svg viewBox="0 0 120 120" role="img"><circle cx="60" cy="60" r="' + r + '" fill="none" stroke="#EADFD3" stroke-width="16"/>';
    if (totale > 0) {
      let offset = 0;
      valori.forEach((x) => {
        const len = (x.kcal / totale) * c;
        svg += '<circle cx="60" cy="60" r="' + r + '" fill="none" stroke="' + (COLORI[x.nome] || '#ccc') + '" stroke-width="16" ' +
          'stroke-dasharray="' + Math.max(len - 0.8, 0.1) + ' ' + c + '" stroke-dashoffset="' + (-offset) + '" transform="rotate(-90 60 60)"><title>' +
          esc(x.nome) + ': ' + fmt(x.kcal) + ' kcal</title></circle>';
        offset += len;
      });
    }
    return svg + '</svg>';
  }

  async function cambiaAllenamento(b) {
    const valore = b.getAttribute('aria-pressed') !== 'true';
    b.setAttribute('aria-pressed', String(valore));
    try {
      const j = await invia({ action: 'allenamento', data: stato.corrente, tipo: b.dataset.tipo, valore: valore });
      stato.giorno = j.giorno;
    } catch (e) {
      b.setAttribute('aria-pressed', String(!valore));
      avviso(e.message);
    }
  }

  async function nuovoGiorno() {
    attesa(true);
    try {
      const j = await invia({ action: 'nuovoGiorno' });
      stato.giorni = j.giorni;
      stato.corrente = j.data;
      stato.giorno = j.giorno;
      aggiornaTestata();
      disegna();
      avviso('Aggiunto ' + etichetta(j.data).giorno + '.');
    } catch (e) { avviso(e.message); }
    finally { attesa(false); }
  }

  $('prec').onclick = () => { const i = stato.giorni.indexOf(stato.corrente); if (i < stato.giorni.length - 1) vaiA(stato.giorni[i + 1]); };
  $('succ').onclick = () => { const i = stato.giorni.indexOf(stato.corrente); if (i > 0) vaiA(stato.giorni[i - 1]); };
  $('nuovo').onclick = nuovoGiorno;

  /* ---------- Pannello alimenti ---------- */
  function porzione(a) {
    if (a.p !== '' && a.p !== null && a.p !== undefined) return fmt(a.p, 1) + ' ' + a.u;
    if (a.c === 'Frutta') return '150 g';
    if (a.c === 'Verdure') return '100 g';
    return 'dal piano';
  }

  function apriPannello(i) {
    stato.pasto = i;
    stato.scelta = stato.giorno.pasti[i].alimenti.slice();
    stato.filtro = null;
    $('pannello-titolo').textContent = stato.giorno.pasti[i].nome;
    $('cerca').value = '';
    disegnaFiltri();
    disegnaLista();
    $('velo').classList.remove('nascosto');
    requestAnimationFrame(() => { $('velo').classList.add('aperto'); $('pannello').classList.add('aperto'); });
  }
  function chiudiPannello() {
    $('velo').classList.remove('aperto');
    $('pannello').classList.remove('aperto');
    setTimeout(() => $('velo').classList.add('nascosto'), 250);
  }
  function disegnaFiltri() {
    const cats = stato.dati.categorie;
    $('filtri').innerHTML = '<button class="filtro" aria-pressed="' + (stato.filtro === null) + '" data-cat="">Tutti</button>' +
      cats.map((c) => '<button class="filtro" aria-pressed="' + (stato.filtro === c) + '" data-cat="' + esc(c) + '"><i style="background:' + (COLORI[c] || '#ccc') + '"></i>' + esc(c) + '</button>').join('');
    document.querySelectorAll('.filtro').forEach((b) => b.onclick = () => { stato.filtro = b.dataset.cat || null; disegnaFiltri(); disegnaLista(); });
  }
  function disegnaLista() {
    const q = $('cerca').value.trim().toLowerCase();
    const ing = stato.dati.ingredienti.filter((a) =>
      (!stato.filtro || a.c === stato.filtro) && (!q || a.n.toLowerCase().includes(q)));
    let html = '', ultimaCat = null;
    stato.dati.categorie.concat(['']).forEach((cat) => {
      const gruppo = ing.filter((a) => cat ? a.c === cat : stato.dati.categorie.indexOf(a.c) < 0);
      if (!gruppo.length) return;
      if (cat !== ultimaCat) {
        html += '<div class="gruppo"><i style="background:' + (COLORI[cat] || '#ccc') + '"></i>' + esc(cat || 'Altro') + '</div>';
        ultimaCat = cat;
      }
      html += gruppo.map((a) => '<button class="voce" role="checkbox" aria-checked="' + stato.scelta.includes(a.n) + '" data-nome="' + esc(a.n) + '">' +
        '<span class="spunta"></span><span class="nome">' + esc(a.n) + '</span><span class="porzione">' + esc(porzione(a)) + '</span></button>').join('');
    });
    $('lista').innerHTML = html || '<p class="vuoto">Nessun alimento trovato. Puoi aggiungerlo nel foglio Ingredienti.</p>';
    document.querySelectorAll('.voce').forEach((b) => b.onclick = () => alterna(b.dataset.nome, b));
    disegnaSelezionati();
  }
  function alterna(nome, b) {
    const i = stato.scelta.indexOf(nome);
    if (i >= 0) stato.scelta.splice(i, 1); else stato.scelta.push(nome);
    if (b) b.setAttribute('aria-checked', String(i < 0));
    disegnaSelezionati();
  }
  function disegnaSelezionati() {
    $('selezionati').innerHTML = stato.scelta.map((n) =>
      '<span class="chip">' + esc(n) + '<button aria-label="Togli ' + esc(n) + '" data-nome="' + esc(n) + '">×</button></span>').join('');
    document.querySelectorAll('#selezionati button').forEach((b) => b.onclick = () => {
      alterna(b.dataset.nome);
      const voce = document.querySelector('.voce[data-nome="' + CSS.escape(b.dataset.nome) + '"]');
      if (voce) voce.setAttribute('aria-checked', 'false');
    });
    $('salva').textContent = stato.scelta.length ? 'Salva ' + stato.scelta.length + (stato.scelta.length === 1 ? ' alimento' : ' alimenti') : 'Salva pasto vuoto';
  }
  $('cerca').oninput = disegnaLista;
  $('chiudi').onclick = chiudiPannello;
  $('velo').onclick = chiudiPannello;
  $('salva').onclick = async () => {
    const pasto = stato.pasto, scelta = stato.scelta.slice();
    chiudiPannello();
    attesa(true);
    try {
      const j = await invia({ action: 'salvaPasto', data: stato.corrente, pasto: pasto, alimenti: scelta });
      stato.giorno = j.giorno;
      disegna();
    } catch (e) { avviso(e.message); }
    finally { attesa(false); }
  };

  // Torna in primo piano: ricarica il giorno (i dati possono essere cambiati dal computer)
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && stato.corrente && !$('pannello').classList.contains('aperto')) vaiA(stato.corrente);
  });

  avvia();
})();
</script>
</body>
</html>
