  /* ---------- MESI ---------- */
  function disegnaMesi() {
    testataSemplice('Mesi', lettura() ? 'sola lettura' : '', lettura() ? '' : '<button class="tondo" id="nuovo-mese" aria-label="Aggiungi il mese successivo">' + ICONE.piu + '</button>');
    if ($('nuovo-mese')) $('nuovo-mese').onclick = aggiungiMese;
    if (!stato.mesi.length) { $('contenuto').innerHTML = '<div class="messaggio"><p>Nessun mese nel foglio.</p></div>'; return; }
    let html = '';
    stato.mesi.forEach((m) => {
      const aperto = !!stato.aperti[m.mese];
      html += '<div class="scatola"><button class="mese-titolo" data-mese="' + m.mese + '" aria-expanded="' + aperto + '">' + esc(m.nome) + ICONE.freccia + '</button>';
      if (aperto) {
        const c = cacheMese(m.mese);
        const giorni = stato.giorni.filter((iso) => iso.slice(0, 7) === m.mese);
        html += '<div class="mese-giorni">' + (giorni.length ? giorni.map((iso) => {
          const g = c[iso];
          const all = g ? [g.allenamento.muscolare ? 'M' : '', g.allenamento.cardio ? 'C' : ''].filter(String).join(' ') : '';
          const nCom = g && g.commenti ? g.commenti.length : 0;
          return '<div class="riga"><button class="principale" data-giorno="' + iso + '" style="text-align:left"><b>' + esc(etichetta(iso).giorno) +
            (all ? '<span class="icone-all">' + all + '</span>' : '') + (nCom ? '<span class="icone-all" style="color:var(--inchiostro-tenue)">💬 ' + nCom + '</span>' : '') + '</b><small>' + (g ? g.pasti.filter((p) => p.alimenti.length).length + ' pasti su 5' : 'caricamento…') + '</small></button>' +
            '<span class="valore">' + (g && g.totale.kcal ? macroBreve(g.totale) : '') + '</span>' +
            (lettura() ? '' : '<button class="x" data-elimina="' + iso + '" aria-label="Elimina ' + esc(etichetta(iso).giorno) + '">×</button>') + '</div>';
        }).join('') : '<p class="vuoto" style="padding:0 16px">Nessun giorno in questo mese.</p>') + '</div>';
        if (!lettura()) html += '<div style="padding:12px 16px 16px"><button class="bottone pericolo largo" data-elimina-mese="' + esc(m.nome) + '">Elimina ' + esc(m.nome) + '</button></div>';
      }
      html += '</div>';
    });
    html += '<p class="centrato vuoto">M = muscolare · C = cardio</p>';
    $('contenuto').innerHTML = html;
    document.querySelectorAll('.mese-titolo').forEach((b) => b.onclick = async () => {
      const ym = b.dataset.mese;
      stato.aperti[ym] = !stato.aperti[ym];
      disegnaMesi();
      if (stato.aperti[ym]) {
        try { await caricaMese(ym); if (stato.vista === 'mesi') disegnaMesi(); } catch (e) { avviso(e.message); }
      }
    });
    document.querySelectorAll('[data-giorno]').forEach((b) => b.onclick = () => { stato.vista = 'diario'; stato.corrente = b.dataset.giorno; disegnaVista(); });
    document.querySelectorAll('[data-elimina]').forEach((b) => b.onclick = () => eliminaGiorno(b.dataset.elimina));
    document.querySelectorAll('[data-elimina-mese]').forEach((b) => b.onclick = () => eliminaMese(b.dataset.eliminaMese));
  }
  async function aggiungiMese() {
    if (!confirm('Creare il foglio del mese successivo all\'ultimo, con il suo primo giorno?')) return;
    attesa(true);
    try {
      const j = await invia({ action: 'aggiungiMese' });
      aggiornaElenchi(j); salvaGiornoInCache(j.giorno);
      stato.aperti[j.data.slice(0, 7)] = true;
      disegnaMesi(); avviso('Creato ' + j.nome + '.');
    } catch (e) { avviso(e.message); }
    finally { attesa(false); }
  }
  async function eliminaGiorno(iso) {
    if (!confirm('Eliminare ' + etichetta(iso).giorno + ' ' + etichetta(iso).mese + ' con tutto quello che hai inserito?')) return;
    attesa(true);
    try {
      const j = await invia({ action: 'eliminaGiorno', data: iso });
      aggiornaElenchi(j);
      const c = cacheMese(iso.slice(0, 7)); delete c[iso]; scriviLocale('mese_' + iso.slice(0, 7), c);
      if (stato.corrente === iso) stato.corrente = stato.giorni[0] || null;
      disegnaMesi(); avviso('Giorno eliminato.');
    } catch (e) { avviso(e.message); }
    finally { attesa(false); }
  }
  async function eliminaMese(nome) {
    const risposta = prompt('Stai per eliminare tutto il mese "' + nome + '" con tutti i suoi giorni. Non si può annullare.\n\nPer confermare scrivi il nome del mese:');
    if (risposta === null) return;
    if (risposta.trim().toLowerCase() !== nome.toLowerCase()) { avviso('Il nome non corrisponde: niente è stato eliminato.'); return; }
    attesa(true);
    try {
      const j = await invia({ action: 'eliminaMese', nome: nome });
      aggiornaElenchi(j); svuotaCache();
      if (stato.corrente && stato.giorni.indexOf(stato.corrente) < 0) stato.corrente = stato.giorni[0] || null;
      disegnaMesi(); avviso(nome + ' eliminato.');
    } catch (e) { avviso(e.message); }
    finally { attesa(false); }
  }

  function elencoIngredienti() {
    const q = stato.cercaIng.trim().toLowerCase();

      const gruppo = ing.filter((a) => a.c === cat);
      if (!gruppo.length) return;
      html += '<div class="gruppo"><i style="background:' + (COLORI[cat] || '#ccc') + '"></i>' + esc(cat) + '</div><div class="scatola" style="margin-top:4px">' +
        gruppo.map((a) => {
          return '<button class="riga" data-ing="' + esc(a.n) + '"><span class="principale"><b>' + esc(a.n) + '</b><small>' + esc(porzione(a)) +
            ' · P ' + fmt(a.pr, 1) + ' · C ' + fmt(a.ca, 1) + ' · G ' + fmt(a.gr, 1) + ' g per ' + (a.u === 'pz' ? 'pezzo' : '100 ' + a.u) + '</small>' + (a.f ? '<span class="fonte' + (/^verificato/i.test(a.f) ? ' ok' : '') + '">' + (/^verificato/i.test(a.f) ? '✓ ' : '') + esc(a.f) + '</span>' : '') + '</span></button>';
        }).join('') + '</div>';
    });
    $('elenco-ing').innerHTML = html || '<p class="vuoto centrato">Nessun ingrediente trovato.</p>';
    $('elenco-ing').querySelectorAll('[data-ing]').forEach((b) => b.onclick = () => modificaIngrediente(b.dataset.ing));
  }
  function modificaIngrediente(nome) {
    const a = nome ? ingrediente(nome) : { c: stato.dati.categorie[0], n: '', u: 'g', p: '', k: 0, pr: 0, ca: 0, gr: 0, f: 'Etichetta del prodotto' };
    if (!a) return;
    const dis = lettura() ? ' disabled' : '';
    const num = (id, etichettaCampo, val) => '<label class="campo"><span>' + etichettaCampo + '</span><input id="' + id + '" inputmode="decimal" value="' + esc(val) + '"' + dis + '></label>';
    const corpo =
      '<label class="campo"><span>Nome</span><input id="i-n" value="' + esc(a.n) + '" autocomplete="off"' + dis + '></label>' +
      '<div class="griglia2"><label class="campo"><span>Categoria</span><select id="i-c"' + dis + '>' + stato.dati.categorie.map((c) => '<option' + (c === a.c ? ' selected' : '') + '>' + esc(c) + '</option>').join('') + '</select></label>' +
      '<label class="campo"><span>Unità</span><select id="i-u"' + dis + '>' + ['g', 'ml', 'pz'].map((u) => '<option' + (u === a.u ? ' selected' : '') + '>' + u + '</option>').join('') + '</select></label></div>' +
      '<label class="campo"><span>Porzione dal piano (vuota = quantità del pasto nel Piano)</span><input id="i-p" inputmode="decimal" value="' + esc(a.p) + '" placeholder="dal piano"' + dis + '></label>' +
      '<p class="nota">Valori nutrizionali per 100 g o 100 ml, oppure per 1 pezzo se l\'unità è pz.</p>' +
      '<div class="griglia2">' + num('i-pr', 'Proteine (g)', a.pr) + num('i-ca', 'Carboidrati (g)', a.ca) + num('i-gr', 'Grassi (g)', a.gr) + '</div>' +
      '<label class="campo"><span>Fonte dei valori</span><input id="i-f" value="' + esc(a.f || '') + '" placeholder="es. etichetta del prodotto, tabelle CREA" autocomplete="off"' + dis + '></label>' +
      (nome && !lettura() ? '<p class="nota">Se cambi il nome, viene aggiornato anche nei pasti già registrati.</p>' : '');
    const azioni = lettura() ? '' : '<button class="bottone largo" id="i-salva">Salva</button>' + (nome ? '<button class="bottone pericolo largo" id="i-elimina">Elimina ingrediente</button>' : '');
    apriFoglio(nome ? (lettura() ? nome : 'Modifica ingrediente') : 'Nuovo ingrediente', corpo, azioni);
    if (lettura()) return;
    const n = (id) => { const v = $(id).value.trim().replace(',', '.'); return v === '' ? '' : Number(v); };
    $('i-salva').onclick = async () => {
      const d = { n: $('i-n').value.trim(), c: $('i-c').value, u: $('i-u').value, p: n('i-p'), pr: n('i-pr') || 0, ca: n('i-ca') || 0, gr: n('i-gr') || 0, f: $('i-f').value.trim() };
      if (!d.n) { avviso('Scrivi il nome dell\'ingrediente.'); return; }
      // Le kcal non si mostrano: restano quelle salvate, o si ricavano dai grammi se questi cambiano
      d.k = nome && d.pr === a.pr && d.ca === a.ca && d.gr === a.gr ? a.k : kcalDaMacro(d);
      if ([d.p, d.pr, d.ca, d.gr].some((x) => x !== '' && (isNaN(x) || x < 0))) { avviso('Controlla i numeri: devono essere positivi.'); return; }
      attesa(true);

        const j = await invia({ action: 'salvaIngrediente', originale: nome || '', ingrediente: d });

    if ($('i-elimina')) $('i-elimina').onclick = async () => {
      if (!confirm('Eliminare "' + nome + '"? Nei giorni in cui l\'hai già scelto resterà scritto, ma non conterà più nei totali.')) return;

        chiudiFoglio(); disegnaIngredienti(); avviso('Ingrediente eliminato.');
      } catch (e) { avviso(e.message); }
      finally { attesa(false); }
    };
  }

        (stato.tokenLettura
          ? '<p style="margin:0 0 12px">Manda questo link alla tua nutrizionista: vedrà diario, mesi, ingredienti e piano e potrà commentare le giornate, senza poter modificare nulla.</p><button class="bottone largo" id="condividi">Condividi il link in sola lettura</button>'
          : '<p class="vuoto" style="margin:0">Per creare il link della nutrizionista imposta <b>TOKEN_LETTURA</b> nello script (una parola diversa dalla tua, almeno 16 caratteri) e pubblica una nuova versione.</p>') +
        '</div><div class="azioni"><button class="bottone secondario largo" id="cambia-coll">Cambia collegamento al foglio</button></div>';
    } else {
      html += '<p class="centrato"><span class="distintivo">Sola lettura</span></p>';
    }
    $('contenuto').innerHTML = notificheHtml + html;
    if (lettura()) return;
    const salvaNotifiche = async (email) => {
      attesa(true);
      try {
        const j = await invia({ action: 'salvaNotifiche', email: email, indirizzo: $('indirizzo-email').value.trim() });
        stato.notifiche = j.notifiche;
        avviso(email ? 'Ti avviseremo anche via email.' : 'Avvisi via email disattivati.');
        return true;
      } catch (e) { avviso(e.message); return false; }
      finally { attesa(false); }
    };
    $('notifica-email').onclick = async () => {
      const acceso = $('notifica-email').getAttribute('aria-pressed') !== 'true';
      $('notifica-email').setAttribute('aria-pressed', String(acceso));
      $('blocco-email').classList.toggle('nascosto', !acceso);
      if (!acceso) { if (!(await salvaNotifiche(false))) { $('notifica-email').setAttribute('aria-pressed', 'true'); $('blocco-email').classList.remove('nascosto'); } }
      else $('indirizzo-email').focus();
    };
    $('salva-notifiche').onclick = () => salvaNotifiche(true);
    $('salva-piano').onclick = async () => {
      const leggi = (el) => { const v = el.value.trim().replace(',', '.'); return v === '' ? '' : Number(v); };
      const obiettivi = { kcal: stato.dati.obiettivi.kcal };  // non si mostra, resta quello del foglio
      document.querySelectorAll('[data-ob]').forEach((el) => { obiettivi[el.dataset.ob] = leggi(el); });
      const quantita = stato.dati.schema.map((r) => r.quantita);
      document.querySelectorAll('[data-q]').forEach((el) => { quantita[Number(el.dataset.q)] = leggi(el); });
      if (Object.values(obiettivi).some((x) => x === '' || isNaN(x) || x < 0) || quantita.some((x) => x !== '' && (isNaN(x) || x < 0))) { avviso('Controlla i numeri: devono essere positivi.'); return; }
      attesa(true);
      try {
        const j = await invia({ action: 'salvaPiano', obiettivi: obiettivi, quantita: quantita });
        stato.dati = j.dati; scriviLocale('dati', j.dati); svuotaCache();
        disegnaPiano(); avviso('Piano salvato.');
      } catch (e) { avviso(e.message); }
      finally { attesa(false); }
    };
    if ($('condividi')) $('condividi').onclick = async () => {
      const link = location.origin + location.pathname + '#u=' + encodeURIComponent(stato.url) + '&l=' + encodeURIComponent(stato.tokenLettura);
      try {
        if (navigator.share) await navigator.share({ title: 'Il mio piano alimentare', url: link });
        else { await navigator.clipboard.writeText(link); avviso('Link copiato.'); }
      } catch (e) { /* condivisione annullata */ }
    };
    $('cambia-coll').onclick = () => { if (confirm('Vuoi cambiare l\'indirizzo dello script o la parola segreta?')) mostraImpostazioni(); };
  }

  // Tornando sull'app ricarica il mese mostrato (i dati possono essere cambiati dal computer)
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible' || !stato.dati) return;
    if (!lettura()) chiedi({ action: 'avvisi' }).then((j) => {
      const prima = stato.nonLetti.length;
      stato.nonLetti = j.nonLetti || []; aggiornaContatore();
      if (stato.nonLetti.length > prima) avviso('💬 Hai un nuovo commento della nutrizionista.');
    }).catch(() => {});
    if (stato.vista === 'diario' && stato.corrente && !$('pannello').classList.contains('aperto')) {
      caricaMese(stato.corrente.slice(0, 7), true).then(() => mostraGiornoDaCache()).catch(() => {});
    }
  });

  stato.vista = 'diario';
  document.querySelectorAll('.scheda').forEach((b) => b.setAttribute('aria-current', b.dataset.vista === 'diario' ? 'page' : 'false'));
  avvia();
})();
</script>
</body>
</html>
